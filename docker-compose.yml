services:
  core-server:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "4100:4100"
    environment:
      - REMOTEDECK_MASTER_KEY=${REMOTEDECK_MASTER_KEY}
      - REMOTEDECK_API_TOKEN=${REMOTEDECK_API_TOKEN}
      - REMOTEDECK_ALLOWED_ORIGINS=${REMOTEDECK_ALLOWED_ORIGINS}
      - PORT=4100
      - REMOTEDECK_LISTEN_HOST=0.0.0.0
      - DATABASE_PATH=/data/remotedeck.db
    volumes:
      - remotedeck-data:/data
    restart: unless-stopped

volumes:
  remotedeck-data:
