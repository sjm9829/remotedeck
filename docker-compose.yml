services:
  core-server:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "4100:4100"
    environment:
      - REMOTEDECK_MASTER_KEY=${REMOTEDECK_MASTER_KEY}
      - PORT=4100
      - DATABASE_PATH=/data/remotedeck.db
    volumes:
      - remotedeck-data:/data
    restart: unless-stopped

volumes:
  remotedeck-data:
